name: Reusable DevSecOps Pipeline

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true
      SNYK_TOKEN:
        required: true
      EC2_HOST:
        required: true
      EC2_USERNAME:
        required: true
      EC2_SSH_KEY:
        required: true

jobs:

  # ============================================================
  # 1. BUILD
  # ============================================================

  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate application
        run: |
          python -m py_compile app.py

      - name: Create build artifact
        run: |
          mkdir -p artifacts/build

          cp app.py artifacts/build/
          cp requirements.txt artifacts/build/

          if [ -d "templates" ]; then
            cp -r templates artifacts/build/
          fi

          if [ -d "static" ]; then
            cp -r static artifacts/build/
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-results
          path: artifacts/build/
          if-no-files-found: error


  # ============================================================
  # 2. UNIT TESTS + COVERAGE
  # ============================================================

  test:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          mkdir -p artifacts/tests

          pytest -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=html:artifacts/tests/coverage

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/tests/
          if-no-files-found: ignore


  # ============================================================
  # 3. SONARQUBE
  # ============================================================

  sonarqube:
    name: SonarQube Analysis
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Create SonarQube report information
        if: always()
        run: |
          mkdir -p artifacts/sonarqube

          cat > artifacts/sonarqube/README.md <<'EOF'
          # SonarQube Analysis

          SonarQube Cloud analysis was executed by the DevSecOps pipeline.

          The complete analysis is available in the SonarQube Cloud project.

          Analysis includes:

          - Bugs
          - Vulnerabilities
          - Security Hotspots
          - Code Smells
          - Code Quality
          - Coverage
          EOF

      - name: Upload SonarQube information
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-results
          path: artifacts/sonarqube/
          if-no-files-found: ignore


  # ============================================================
  # 4. SNYK
  # ============================================================

  snyk:
    name: Snyk Security Scan
    needs: sonarqube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Snyk
        run: |
          npm install -g snyk

      - name: Create Snyk report directory
        run: |
          mkdir -p artifacts/snyk

      - name: Run Snyk dependency scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test \
            --file=requirements.txt \
            --package-manager=pip \
            --severity-threshold=high \
            --json-file-output=artifacts/snyk/snyk-report.json

      - name: Create Snyk HTML report
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = Path("artifacts/snyk/snyk-report.json")
          output = Path("artifacts/snyk/index.html")

          if report.exists():
              try:
                  data = json.loads(report.read_text())
                  vulnerabilities = data.get("vulnerabilities", [])

                  rows = []

                  for item in vulnerabilities:
                      package = item.get("packageName", "Unknown")
                      version = item.get("version", "Unknown")
                      severity = item.get("severity", "Unknown")
                      title = item.get("title", "Unknown")

                      rows.append(
                          f"<tr>"
                          f"<td>{package}</td>"
                          f"<td>{version}</td>"
                          f"<td>{severity}</td>"
                          f"<td>{title}</td>"
                          f"</tr>"
                      )

                  html = f"""<!DOCTYPE html>
          <html>
          <head>
          <meta charset="UTF-8">
          <title>Snyk Security Report</title>
          <style>
          body {{
              font-family: Arial, sans-serif;
              margin: 40px;
          }}
          table {{
              border-collapse: collapse;
              width: 100%;
          }}
          th, td {{
              border: 1px solid #ddd;
              padding: 10px;
          }}
          th {{
              background: #f2f2f2;
          }}
          </style>
          </head>
          <body>

          <h1>Snyk Security Report</h1>

          <p>
          Total vulnerabilities:
          <strong>{len(vulnerabilities)}</strong>
          </p>

          <table>
          <tr>
              <th>Package</th>
              <th>Version</th>
              <th>Severity</th>
              <th>Issue</th>
          </tr>

          {''.join(rows)}

          </table>

          </body>
          </html>
          """

                  output.write_text(html)

              except Exception as exc:
                  output.write_text(
                      f"<html><body>"
                      f"<h1>Snyk Report</h1>"
                      f"<p>Unable to parse Snyk report: {exc}</p>"
                      f"</body></html>"
                  )
          else:
              output.write_text(
                  "<html><body>"
                  "<h1>Snyk Report</h1>"
                  "<p>No Snyk JSON report was generated.</p>"
                  "</body></html>"
              )
          PY

      - name: Upload Snyk reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-results
          path: artifacts/snyk/
          if-no-files-found: ignore


  # ============================================================
  # 5. DAST
  # ============================================================

  dast:
    name: OWASP ZAP DAST Scan
    needs: snyk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Flask application
        run: |
          nohup python app.py > app.log 2>&1 &
          echo $! > flask.pid
          sleep 5

      - name: Verify application is running
        run: |
          curl --fail http://127.0.0.1:8080/
          curl --fail http://127.0.0.1:8080/health

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://127.0.0.1:8080"
          token: ${{ github.token }}
          artifact_name: zap-dast-report
          allow_issue_writing: false
          cmd_options: "-I"

      - name: Create DAST report directory
        if: always()
        run: |
          mkdir -p artifacts/dast

          for file in \
            report_html.html \
            report_md.md \
            report_json.json \
            report_xml.xml \
            app.log
          do
            if [ -f "$file" ]; then
              cp "$file" artifacts/dast/
            fi
          done

      - name: Upload DAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-results
          path: artifacts/dast/
          if-no-files-found: ignore


  # ============================================================
  # 6. EC2 DEPLOYMENT
  # ============================================================

  deploy:
    name: Production EC2 Deployment
    needs: dast
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    uses: ./.github/workflows/deploy-ec2.yml

    secrets:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}


  # ============================================================
  # 7. GITHUB PAGES REPORTING
  # ============================================================

  publish-pages:
    name: Publish DevSecOps Reports to GitHub Pages

    needs:
      - build
      - test
      - sonarqube
      - snyk
      - dast
      - deploy

    # Pages should be published only after main deployment.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # --------------------------------------------------------
      # Download build artifact
      # --------------------------------------------------------

      - name: Download build reports
        uses: actions/download-artifact@v4
        with:
          name: build-results
          path: reports/build

      # --------------------------------------------------------
      # Download test artifact
      # --------------------------------------------------------

      - name: Download test reports
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: reports/tests

      # --------------------------------------------------------
      # Download SonarQube artifact
      # --------------------------------------------------------

      - name: Download SonarQube reports
        uses: actions/download-artifact@v4
        with:
          name: sonarqube-results
          path: reports/sonarqube

      # --------------------------------------------------------
      # Download Snyk artifact
      # --------------------------------------------------------

      - name: Download Snyk reports
        uses: actions/download-artifact@v4
        with:
          name: snyk-results
          path: reports/snyk

      # --------------------------------------------------------
      # Download DAST artifact
      # --------------------------------------------------------

      - name: Download DAST reports
        uses: actions/download-artifact@v4
        with:
          name: dast-results
          path: reports/dast

      # --------------------------------------------------------
      # Create report dashboard
      # --------------------------------------------------------

      - name: Generate HTML dashboard
        run: |
          cat > reports/index.html <<'EOF'
          <!DOCTYPE html>
          <html>

          <head>
            <meta charset="UTF-8">

            <title>DevSecOps Pipeline Report</title>

            <style>
              body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 40px;
                background: #f5f7fa;
              }

              .container {
                max-width: 1100px;
                margin: auto;
              }

              h1 {
                margin-bottom: 10px;
              }

              .subtitle {
                color: #666;
                margin-bottom: 30px;
              }

              .grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 20px;
              }

              .card {
                background: white;
                padding: 25px;
                border-radius: 10px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.08);
              }

              .status {
                font-size: 28px;
                margin-bottom: 10px;
              }

              .card h2 {
                margin-top: 0;
              }

              a {
                text-decoration: none;
              }

              .links {
                margin-top: 15px;
              }

              .links a {
                display: inline-block;
                margin-right: 10px;
                padding: 8px 12px;
                border-radius: 6px;
                background: #eef2f7;
                color: #222;
              }

              footer {
                margin-top: 40px;
                color: #777;
                font-size: 14px;
              }
            </style>

          </head>

          <body>

          <div class="container">

            <h1>DevSecOps Pipeline Report</h1>

            <div class="subtitle">
              Python Flask Application
            </div>

            <div class="grid">

              <div class="card">
                <div class="status">✅</div>
                <h2>Build</h2>
                <p>Application build completed successfully.</p>

                <div class="links">
                  <a href="./build/">View Build</a>
                </div>
              </div>


              <div class="card">
                <div class="status">✅</div>
                <h2>Unit Tests</h2>
                <p>Automated tests and coverage report.</p>

                <div class="links">
                  <a href="./tests/coverage/">Coverage</a>
                </div>
              </div>


              <div class="card">
                <div class="status">✅</div>
                <h2>SonarQube</h2>
                <p>Static code quality and security analysis.</p>

                <div class="links">
                  <a href="./sonarqube/">Report</a>
                </div>
              </div>


              <div class="card">
                <div class="status">✅</div>
                <h2>Snyk</h2>
                <p>Python dependency security analysis.</p>

                <div class="links">
                  <a href="./snyk/">HTML Report</a>
                  <a href="./snyk/snyk-report.json">JSON</a>
                </div>
              </div>


              <div class="card">
                <div class="status">✅</div>
                <h2>DAST</h2>
                <p>OWASP ZAP dynamic application security testing.</p>

                <div class="links">
                  <a href="./dast/report_html.html">HTML</a>
                  <a href="./dast/report_json.json">JSON</a>
                  <a href="./dast/report_xml.xml">XML</a>
                </div>
              </div>


              <div class="card">
                <div class="status">✅</div>
                <h2>EC2 Deployment</h2>
                <p>Application deployed to production EC2.</p>
              </div>

            </div>

            <footer>
              Generated automatically by GitHub Actions.
            </footer>

          </div>

          </body>
          </html>
          EOF

      # --------------------------------------------------------
      # Configure GitHub Pages
      # --------------------------------------------------------

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # --------------------------------------------------------
      # Upload Pages artifact
      # --------------------------------------------------------

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: reports

      # --------------------------------------------------------
      # Deploy Pages
      # --------------------------------------------------------

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4