name: Reusable DevSecOps Pipeline

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true
      SNYK_TOKEN:
        required: true
      EC2_HOST:
        required: true
      EC2_USERNAME:
        required: true
      EC2_SSH_KEY:
        required: true

jobs:

  # ============================================================
  # 1. BUILD
  # ============================================================

  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate application
        run: |
          python -m py_compile app.py

      - name: Create build artifact
        run: |
          mkdir -p artifacts/build

          cp app.py artifacts/build/
          cp requirements.txt artifacts/build/

          if [ -d "templates" ]; then
            cp -r templates artifacts/build/
          fi

          if [ -d "static" ]; then
            cp -r static artifacts/build/
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: build-results
          path: artifacts/build/
          if-no-files-found: error


  # ============================================================
  # 2. UNIT TESTS + COVERAGE
  # ============================================================

  test:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          mkdir -p artifacts/tests

          pytest -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=html:artifacts/tests/coverage

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: artifacts/tests/
          if-no-files-found: ignore


  # ============================================================
  # 3. SONARQUBE
  # ============================================================

  sonarqube:
    name: SonarQube Analysis
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Create SonarQube HTML report
        if: always()
        run: |
          mkdir -p artifacts/sonarqube

          cat > artifacts/sonarqube/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>SonarQube Analysis</title>
            <style>
              body {
                font-family: Arial, sans-serif;
                margin: 40px;
                background: #f5f7fa;
              }

              .container {
                max-width: 900px;
                margin: auto;
                background: white;
                padding: 30px;
                border-radius: 10px;
              }

              h1 {
                color: #222;
              }

              .item {
                padding: 12px;
                margin: 8px 0;
                background: #f1f3f5;
                border-radius: 6px;
              }
            </style>
          </head>

          <body>
            <div class="container">

              <h1>SonarQube Analysis</h1>

              <p>
                SonarQube Cloud analysis was executed successfully
                as part of the DevSecOps pipeline.
              </p>

              <h2>Analysis Includes</h2>

              <div class="item">🐞 Bugs</div>
              <div class="item">🔐 Vulnerabilities</div>
              <div class="item">🔥 Security Hotspots</div>
              <div class="item">🧹 Code Smells</div>
              <div class="item">📊 Code Quality</div>
              <div class="item">🧪 Coverage</div>

              <p>
                The detailed analysis is available in the configured
                SonarQube Cloud project.
              </p>

            </div>
          </body>
          </html>
          EOF

      - name: Upload SonarQube information
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sonarqube-results
          path: artifacts/sonarqube/
          if-no-files-found: ignore


  # ============================================================
  # 4. SNYK
  # ============================================================

  snyk:
    name: Snyk Security Scan
    needs: sonarqube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Snyk
        run: |
          npm install -g snyk

      - name: Create Snyk report directory
        run: |
          mkdir -p artifacts/snyk

      - name: Run Snyk dependency scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test \
            --file=requirements.txt \
            --package-manager=pip \
            --severity-threshold=high \
            --json-file-output=artifacts/snyk/snyk-report.json

      - name: Create Snyk HTML report
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from html import escape

          report = Path("artifacts/snyk/snyk-report.json")
          output = Path("artifacts/snyk/index.html")

          vulnerabilities = []

          if report.exists():
              try:
                  data = json.loads(report.read_text())
                  vulnerabilities = data.get("vulnerabilities", [])
              except Exception:
                  vulnerabilities = []

          rows = []

          for item in vulnerabilities:
              package = escape(str(item.get("packageName", "Unknown")))
              version = escape(str(item.get("version", "Unknown")))
              severity = escape(str(item.get("severity", "Unknown")))
              title = escape(str(item.get("title", "Unknown")))

              rows.append(
                  f"<tr>"
                  f"<td>{package}</td>"
                  f"<td>{version}</td>"
                  f"<td>{severity}</td>"
                  f"<td>{title}</td>"
                  f"</tr>"
              )

          if not rows:
              rows.append(
                  "<tr>"
                  "<td colspan='4'>No vulnerabilities found or report unavailable.</td>"
                  "</tr>"
              )

          html = f"""
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>Snyk Security Report</title>
            <style>
              body {{
                font-family: Arial, sans-serif;
                margin: 40px;
                background: #f5f7fa;
              }}

              .container {{
                max-width: 1100px;
                margin: auto;
                background: white;
                padding: 30px;
                border-radius: 10px;
              }}

              table {{
                border-collapse: collapse;
                width: 100%;
              }}

              th, td {{
                border: 1px solid #ddd;
                padding: 10px;
              }}

              th {{
                background: #f2f2f2;
              }}
            </style>
          </head>

          <body>

          <div class="container">

            <h1>Snyk Security Report</h1>

            <p>
              Total vulnerabilities:
              <strong>{len(vulnerabilities)}</strong>
            </p>

            <table>
              <tr>
                <th>Package</th>
                <th>Version</th>
                <th>Severity</th>
                <th>Issue</th>
              </tr>

              {''.join(rows)}

            </table>

          </div>

          </body>
          </html>
          """

          output.write_text(html)
          PY

      - name: Upload Snyk reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: snyk-results
          path: artifacts/snyk/
          if-no-files-found: ignore


  # ============================================================
  # 5. DAST
  # ============================================================

  dast:
    name: OWASP ZAP DAST Scan
    needs: snyk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Flask application
        run: |
          nohup python app.py > app.log 2>&1 &
          echo $! > flask.pid
          sleep 5

      - name: Verify application is running
        run: |
          curl --fail http://127.0.0.1:8080/
          curl --fail http://127.0.0.1:8080/health

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:8080
          token: ${{ github.token }}
          artifact_name: zap-dast-report
          allow_issue_writing: false
          cmd_options: "-I"

      - name: Create DAST report directory
        if: always()
        run: |
          mkdir -p artifacts/dast

          for file in \
            report_html.html \
            report_md.md \
            report_json.json \
            report_xml.xml \
            app.log
          do
            if [ -f "$file" ]; then
              cp "$file" artifacts/dast/
            fi
          done

          cat > artifacts/dast/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>OWASP ZAP DAST Report</title>
            <style>
              body {
                font-family: Arial, sans-serif;
                margin: 40px;
                background: #f5f7fa;
              }

              .container {
                max-width: 900px;
                margin: auto;
                background: white;
                padding: 30px;
                border-radius: 10px;
              }

              a {
                display: block;
                margin: 12px 0;
                padding: 12px;
                background: #eef2f7;
                text-decoration: none;
                color: #222;
                border-radius: 6px;
              }
            </style>
          </head>

          <body>

          <div class="container">

            <h1>OWASP ZAP DAST Report</h1>

            <p>
              Dynamic Application Security Testing was performed
              against the Flask application.
            </p>

            <a href="./report_html.html">HTML Report</a>
            <a href="./report_md.md">Markdown Report</a>
            <a href="./report_json.json">JSON Report</a>
            <a href="./report_xml.xml">XML Report</a>

          </div>

          </body>
          </html>
          EOF

      - name: Upload DAST reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dast-results
          path: artifacts/dast/
          if-no-files-found: ignore


  # ============================================================
  # 6. EC2 DEPLOYMENT
  # ============================================================

  deploy:
    name: Production EC2 Deployment
    needs: dast
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    uses: ./.github/workflows/deploy-ec2.yml

    secrets:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}


  # ============================================================
  # 7. GITHUB PAGES REPORTING
  # ============================================================

  publish-pages:
    name: Publish DevSecOps Reports to GitHub Pages

    needs:
      - build
      - test
      - sonarqube
      - snyk
      - dast
      - deploy

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # --------------------------------------------------------
      # Download artifacts
      # --------------------------------------------------------

      - name: Download build reports
        uses: actions/download-artifact@v7
        with:
          name: build-results
          path: reports/build

      - name: Download test reports
        uses: actions/download-artifact@v7
        with:
          name: test-results
          path: reports/tests

      - name: Download SonarQube reports
        uses: actions/download-artifact@v7
        with:
          name: sonarqube-results
          path: reports/sonarqube

      - name: Download Snyk reports
        uses: actions/download-artifact@v7
        with:
          name: snyk-results
          path: reports/snyk

      - name: Download DAST reports
        uses: actions/download-artifact@v7
        with:
          name: dast-results
          path: reports/dast


      # --------------------------------------------------------
      # Create BUILD index page
      # --------------------------------------------------------

      - name: Create Build report page
        run: |
          cat > reports/build/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>Build Report</title>
          </head>

          <body style="font-family:Arial;margin:40px">

            <h1>Build Report</h1>

            <p>Application build completed successfully.</p>

            <h2>Build Files</h2>

            <ul>
              <li><a href="./app.py">app.py</a></li>
              <li><a href="./requirements.txt">requirements.txt</a></li>
            </ul>

            <h3>Application Directories</h3>

            <p>
              Templates and static files are included in the
              build artifact.
            </p>

            <a href="../">← Back to Dashboard</a>

          </body>
          </html>
          EOF


      # --------------------------------------------------------
      # Create TEST index page
      # --------------------------------------------------------

      - name: Create Test report page
        run: |
          cat > reports/tests/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>Unit Test Report</title>
          </head>

          <body style="font-family:Arial;margin:40px">

            <h1>Unit Test Report</h1>

            <p>
              Automated pytest tests were executed with coverage.
            </p>

            <p>
              <a href="./coverage/">
                Open Coverage Report
              </a>
            </p>

            <a href="../">← Back to Dashboard</a>

          </body>
          </html>
          EOF


      # --------------------------------------------------------
      # Create SONARQUBE index page
      # --------------------------------------------------------

      - name: Create SonarQube report page
        run: |
          cat > reports/sonarqube/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>SonarQube Report</title>
          </head>

          <body style="font-family:Arial;margin:40px">

            <h1>SonarQube Analysis</h1>

            <p>
              Static code quality and security analysis
              was executed by SonarQube Cloud.
            </p>

            <ul>
              <li>Bugs</li>
              <li>Vulnerabilities</li>
              <li>Security Hotspots</li>
              <li>Code Smells</li>
              <li>Code Quality</li>
              <li>Coverage</li>
            </ul>

            <a href="../">← Back to Dashboard</a>

          </body>
          </html>
          EOF


      # --------------------------------------------------------
      # Create MAIN DASHBOARD
      # --------------------------------------------------------

      - name: Generate HTML dashboard
        run: |
          cat > reports/index.html <<'EOF'
          <!DOCTYPE html>
          <html>

          <head>

            <meta charset="UTF-8">

            <title>DevSecOps Pipeline Report</title>

            <style>

              body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 40px;
                background: #f5f7fa;
              }

              .container {
                max-width: 1100px;
                margin: auto;
              }

              h1 {
                margin-bottom: 10px;
              }

              .subtitle {
                color: #666;
                margin-bottom: 30px;
              }

              .grid {
                display: grid;
                grid-template-columns:
                  repeat(auto-fit, minmax(250px, 1fr));
                gap: 20px;
              }

              .card {
                background: white;
                padding: 25px;
                border-radius: 10px;
                box-shadow:
                  0 2px 8px rgba(0,0,0,0.08);
              }

              .status {
                font-size: 28px;
              }

              .links {
                margin-top: 15px;
              }

              .links a {
                display: inline-block;
                margin: 5px;
                padding: 8px 12px;
                border-radius: 6px;
                background: #eef2f7;
                color: #222;
                text-decoration: none;
              }

            </style>

          </head>

          <body>

          <div class="container">

            <h1>DevSecOps Pipeline Report</h1>

            <div class="subtitle">
              Python Flask Application
            </div>

            <div class="grid">

              <div class="card">

                <div class="status">✅</div>

                <h2>Build</h2>

                <p>
                  Application build completed successfully.
                </p>

                <div class="links">
                  <a href="./build/">
                    View Build
                  </a>
                </div>

              </div>


              <div class="card">

                <div class="status">✅</div>

                <h2>Unit Tests</h2>

                <p>
                  Automated tests and coverage.
                </p>

                <div class="links">
                  <a href="./tests/">
                    Test Report
                  </a>

                  <a href="./tests/coverage/">
                    Coverage
                  </a>
                </div>

              </div>


              <div class="card">

                <div class="status">✅</div>

                <h2>SonarQube</h2>

                <p>
                  Static code quality and security analysis.
                </p>

                <div class="links">
                  <a href="./sonarqube/">
                    Report
                  </a>
                </div>

              </div>


              <div class="card">

                <div class="status">✅</div>

                <h2>Snyk</h2>

                <p>
                  Python dependency security analysis.
                </p>

                <div class="links">
                  <a href="./snyk/">
                    HTML Report
                  </a>

                  <a href="./snyk/snyk-report.json">
                    JSON
                  </a>
                </div>

              </div>


              <div class="card">

                <div class="status">✅</div>

                <h2>DAST</h2>

                <p>
                  OWASP ZAP dynamic security testing.
                </p>

                <div class="links">

                  <a href="./dast/">
                    DAST Dashboard
                  </a>

                  <a href="./dast/report_html.html">
                    HTML
                  </a>

                  <a href="./dast/report_json.json">
                    JSON
                  </a>

                </div>

              </div>


              <div class="card">

                <div class="status">✅</div>

                <h2>EC2 Deployment</h2>

                <p>
                  Application deployed to production EC2.
                </p>

              </div>

            </div>

          </div>

          </body>

          </html>
          EOF


      # --------------------------------------------------------
      # Configure Pages
      # --------------------------------------------------------

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6


      # --------------------------------------------------------
      # Upload Pages artifact
      # --------------------------------------------------------

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports


      # --------------------------------------------------------
      # Deploy Pages
      # --------------------------------------------------------

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5


      # --------------------------------------------------------
      # ADD LINKS TO GITHUB ACTIONS SUMMARY
      # --------------------------------------------------------

      - name: Add DevSecOps report links to workflow summary
        if: success()
        run: |

          PAGE_URL="${{ steps.deployment.outputs.page_url }}"

          PAGE_URL="${PAGE_URL%/}"

          {
            echo "# 📊 DevSecOps Reports"
            echo ""
            echo "GitHub Pages reports generated successfully."
            echo ""
            echo "## 🔗 Report Links"
            echo ""
            echo "- 🌐 [DevSecOps Dashboard](${PAGE_URL}/)"
            echo "- 🏗️ [Build Report](${PAGE_URL}/build/)"
            echo "- 🧪 [Unit Tests](${PAGE_URL}/tests/)"
            echo "- 📈 [Coverage Report](${PAGE_URL}/tests/coverage/)"
            echo "- 🔍 [SonarQube Report](${PAGE_URL}/sonarqube/)"
            echo "- 🛡️ [Snyk Report](${PAGE_URL}/snyk/)"
            echo "- 🚨 [OWASP ZAP DAST Report](${PAGE_URL}/dast/)"
            echo ""
            echo "## 🚀 Deployment"
            echo ""
            echo "- [Production GitHub Pages](${PAGE_URL}/)"
          } >> "$GITHUB_STEP_SUMMARY"