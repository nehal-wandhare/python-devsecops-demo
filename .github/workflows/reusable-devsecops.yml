name: Reusable DevSecOps Pipeline

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true
      SNYK_TOKEN:
        required: true
      EC2_HOST:
        required: true
      EC2_USERNAME:
        required: true
      EC2_SSH_KEY:
        required: true

jobs:

  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate application
        run: |
          python -m py_compile app.py

      - name: Create build artifact
        run: |
          mkdir -p artifacts/build
          cp app.py artifacts/build/
          cp requirements.txt artifacts/build/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-results
          path: artifacts/build/


  test:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          mkdir -p artifacts/tests
          pytest -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=html:artifacts/tests/coverage

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/tests/


  sonarqube:
    name: SonarQube Analysis
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


  snyk:
    name: Snyk Security Scan
    needs: sonarqube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Snyk
        run: |
          npm install -g snyk

      - name: Run Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test --file=requirements.txt --package-manager=pip --severity-threshold=high


  dast:
    name: DAST Security Scan
    needs: snyk
    runs-on: ubuntu-latest

    steps:
      - name: DAST placeholder
        run: |
          echo "DAST stage will use the existing working ZAP workflow."


  deploy:
    name: Deploy to EC2
    needs: dast
    runs-on: ubuntu-latest

    steps:
      - name: Deployment placeholder
        run: |
          echo "Deployment stage will reuse the existing working EC2 deployment logic."